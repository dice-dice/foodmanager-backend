name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test
        run: mvn -B clean test
        env:
          SPRING_PROFILES_ACTIVE: test
　　　　　　JWT_SECRET: ${{ secrets.JWT_SECRET }}
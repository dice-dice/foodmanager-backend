#spring.datasource.url=jdbc:mysql://localhost:3306/fridgedb
spring.datasource.url=jdbc:mysql://localhost:3306/food_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# App Properties
fridge.inventory.app.jwtSecret=${JWT_SECRET}
fridge.inventory.app.jwtExpirationMs=86400000

logging.level.me.paulschwarz=DEBUG
